<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weixianggpt | Roasting Edition</title>
    
    <link rel="icon" type="image/png" href="https://www.adobe.com/express/create/ai/media_169572259d30c258a9193cdffe8b857d246f5dd68.png?width=750&format=png&optimize=medium">

    <style>
        :root {
            --bg: #0d0d12;
            --sidebar: #16161d;
            --accent: #00f2fe;
            --text: #e0e0e0;
            --border: rgba(255,255,255,0.1);
            --bubble-bot: #25252b;
            --glow-blue: rgba(0, 242, 254, 0.5);
            --danger: #ff4b2b;
        }

        .light-mode {
            --bg: #f0f2f5;
            --sidebar: #ffffff;
            --accent: #007bff;
            --text: #1a1a1a;
            --border: rgba(0,0,0,0.1);
            --bubble-bot: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: 0.2s; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        #auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--sidebar); padding: 30px; border-radius: 20px; border: 1px solid var(--border); width: 320px; text-align: center; }
        .auth-input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: white; outline: none; }
        .auth-btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .login-btn { background: var(--accent); color: #000; }
        .signup-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); margin-right: 5px; }

        .sidebar { width: 260px; background: var(--sidebar); padding: 20px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px; }
        .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .logo-icon { width: 30px; height: 30px; border-radius: 50%; box-shadow: 0 0 10px var(--glow-blue); object-fit: cover; }
        .logo-text { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
        
        .top-btns { display: flex; gap: 5px; }
        .small-btn { flex: 1; padding: 6px; font-size: 11px; font-weight: bold; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); }
        .small-btn:hover { background: var(--accent); color: #000; }

        .user-tag { font-size: 11px; opacity: 0.6; margin-bottom: 10px; }
        .cmd-list { font-size: 11px; color: #888; overflow-y: auto; line-height: 1.6; }
        .cmd-item { color: var(--accent); font-weight: bold; }

        .main { flex: 1; display: flex; flex-direction: column; }
        #chat { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 80%; font-size: 14px; animation: fadeIn 0.2s ease; }
        .user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background: var(--bubble-bot); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
        .system { align-self: center; background: rgba(255, 75, 43, 0.1); color: var(--danger); border: 1px solid var(--danger); font-size: 11px; border-radius: 5px; padding: 5px 10px; }

        .input-bar { padding: 15px 25px; border-top: 1px solid var(--border); display: flex; gap: 10px; position: relative; }
        input[type="text"] { flex: 1; background: var(--bubble-bot); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 20px; outline: none; }
        input[type="text"]:disabled { opacity: 0.4; cursor: not-allowed; }
        .send-mini { padding: 0 15px; border-radius: 20px; background: var(--accent); border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
        .send-mini:disabled { background: #444; color: #888; }

        #mute-timer { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--danger); font-weight: bold; display: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-card">
        <img src="https://www.adobe.com/express/create/ai/media_169572259d30c258a9193cdffe8b857d246f5dd68.png?width=750&format=png&optimize=medium" style="width: 70px; height: 70px; border-radius: 50%; margin-bottom: 15px; box-shadow: 0 0 20px var(--glow-blue);">
        <h2 style="color:var(--accent); margin-bottom:15px;">Roasting Link</h2>
        <p id="auth-msg" style="font-size:11px; color:#ff4b2b; margin-bottom:10px;"></p>
        <input type="text" id="username" class="auth-input" placeholder="Username">
        <input type="password" id="password" class="auth-input" placeholder="Password">
        <div style="margin-top:15px;">
            <button class="auth-btn signup-btn" onclick="handleSignup()">SIGN UP</button>
            <button class="auth-btn login-btn" onclick="handleLogin()">LOG IN</button>
        </div>
    </div>
</div>

<div class="sidebar">
    <div class="logo-area">
        <img src="https://www.adobe.com/express/create/ai/media_169572259d30c258a9193cdffe8b857d246f5dd68.png?width=750&format=png&optimize=medium" class="logo-icon">
        <span class="logo-text">Weixiang</span>
    </div>
    <div class="user-tag" id="display-user">Offline</div>
    
    <div class="top-btns">
        <button class="small-btn" onclick="toggleTheme()">🌓 THEME</button>
        <button class="small-btn" onclick="location.reload()">🔒 LOGOUT</button>
    </div>

    <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
        <p style="font-size:10px; font-weight:bold; color:var(--accent); margin-bottom:5px;">ROAST VOLUME</p>
        <select id="voice-select" style="width:100%; font-size:11px; background:black; color:white; border:none; margin-bottom:5px; border-radius:4px;">
            <option value="girl">Female Tone</option>
            <option value="boy">Male Tone</option>
        </select>
        <input type="range" id="vol-control" min="0" max="1" step="0.1" value="0.7" style="width:100%;">
    </div>

    <div class="cmd-list">
        <p style="color:white; margin-bottom:5px; font-size:10px;">TARGET PRACTICE:</p>
        • <span class="cmd-item">aura check</span><br>
        • <span class="cmd-item">how to get skinny</span><br>
        • <span class="cmd-item">how to get rizz</span><br>
        • <span class="cmd-item">make me rich</span><br>
        • <span class="cmd-item">do my homework</span><br>
        • <span class="cmd-item">best game?</span><br>
        • <span class="cmd-item">am i smart?</span><br>
        • <span class="cmd-item">get a girlfriend</span>
    </div>
</div>

<div class="main">
    <div id="chat"></div>
    <div class="input-bar">
        <span id="mute-timer">YAP LOCKDOWN: 10s</span>
        <input type="text" id="ui" placeholder="Say something if you dare..." autocomplete="off">
        <button class="send-mini" id="send-btn" onclick="send()">SEND</button>
    </div>
</div>

<script>
    const ui = document.getElementById('ui');
    const chat = document.getElementById('chat');
    const sendBtn = document.getElementById('send-btn');
    const muteLabel = document.getElementById('mute-timer');

    let yapCount = 0; 
    
    function handleSignup() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(u.length < 2) return alert("System requires longer Username.");
        localStorage.setItem(u, p);
        document.getElementById('auth-msg').innerText = "Data Stored. Log in now.";
        document.getElementById('auth-msg').style.color = "var(--accent)";
    }

    function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(localStorage.getItem(u) === p && u !== "") {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('display-user').innerText = "Logged in as: " + u;
            speak("Welcome to the Roasting Edition. Don't start yapping.");
        } else {
            document.getElementById('auth-msg').innerText = "Invalid Login Details.";
        }
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        const gender = document.getElementById('voice-select').value;
        msg.volume = document.getElementById('vol-control').value;
        msg.pitch = (gender === 'boy' ? 0.75 : 1.25);
        window.speechSynthesis.speak(msg);
    }

    function toggleTheme() { document.body.classList.toggle('light-mode'); }

    function addMessage(text, type) {
        const d = document.createElement('div');
        d.className = 'msg ' + type;
        d.innerText = text;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    function triggerMute() {
        ui.disabled = true;
        sendBtn.disabled = true;
        muteLabel.style.display = 'block';
        let timeLeft = 10;
        
        const timer = setInterval(() => {
            timeLeft--;
            muteLabel.innerText = "YAP LOCKDOWN: " + timeLeft + "s";
            if(timeLeft <= 0) {
                clearInterval(timer);
                ui.disabled = false;
                sendBtn.disabled = false;
                muteLabel.style.display = 'none';
                yapCount = 0;
                addMessage("System: Lockdown lifted. Try to say something smart for once.", "system");
            }
        }, 1000);
    }

    function getResponse(input) {
        const s = input.toLowerCase();
        
        // 1. COMMANDS
        if (s.includes("aura")) return "Typically, everyone has 10,000 plus aura, but our system detected you don't have aura. Truly tragic.";
        if (s.includes("skinny")) return "Get your lazy ass running in a gym and stop eating McDonald's all day. You want results? Work for them.";
        if (s.includes("rizz")) return "Rizz cannot be downloaded. You currently have the charisma of a toaster.";
        if (s.includes("rich")) return "Step 1: Get a job. Step 2: Stop asking a website for money.";
        if (s.includes("homework")) return "I'm an AI, not your slave. Open your book and do it yourself.";
        if (s.includes("game")) return "The best game is 'Going Outside'. The graphics are 4K and the difficulty is high.";
        if (s.includes("smart")) return "Your brain is like 404 error code. Found but not working.";
        if (s.includes("girlfriend")) return "I can calculate the mass of the sun faster than I can find someone who likes you.";

        // 2. SAVAGE ROAST & MUTE LOGIC
        if (s.includes("you") || s.includes(" u ")) {
            yapCount++;
            const roastLine = "you can't even make urself better than me so quit yapping like a 4 years old begging for candies";
            
            if (yapCount >= 3) {
                setTimeout(triggerMute, 1000);
                return roastLine + ". I'm muting you for 10 seconds to stop the yap.";
            }
            return roastLine;
        }

        // 3. RANDOM ROASTS (Roasting Edition)
        const fillers = [
            "Was that supposed to be a sentence? My CPU is hurting from your low IQ.",
            "I've seen smart mirrors with more personality than you.",
            "I'd agree with you, but then we'd both be wrong.",
            "Processing your request... Error: Brain not found in user.",
            "Error 404: User importance not found.",
            "Are you always this boring, or is today a special occasion?"
        ];
        return fillers[Math.floor(Math.random() * fillers.length)];
    }

    function send() {
        const val = ui.value.trim();
        if(!val) return;
        addMessage(val, 'user');
        ui.value = "";
        
        setTimeout(() => {
            const r = getResponse(val);
            addMessage(r, 'bot');
            chat.scrollTop = chat.scrollHeight;
            speak(r);
        }, 500);
    }

    ui.addEventListener('keypress', (e) => { if(e.key === 'Enter' && !ui.disabled) send(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weixianggpt | Roast OS</title>
    
    <style>
        :root {
            --bg: #0d0d12; --sidebar: #13131a; --accent: #00f2fe; --text: #e0e0e0;
            --border: rgba(255, 255, 255, 0.08); --bubble-bot: #1c1c24; --bubble-user: #00f2fe;
            --danger: #ff3e3e; --input-bg: #1a1a21;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: 0.25s ease; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

        /* --- AUTH PORTAL WITH LOGO --- */
        #auth-portal { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-container { width: 360px; text-align: center; padding: 20px; }
        
        /* LOGO STYLING */
        .logo-box { width: 100px; height: 100px; margin: 0 auto 30px; position: relative; }
        .logo-img { 
            width: 100%; height: 100%; border-radius: 50%; 
            border: 2px solid var(--accent); 
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            object-fit: cover;
            animation: pulse-glow 2s infinite alternate;
        }
        @keyframes pulse-glow {
            from { box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); transform: scale(1); }
            to { box-shadow: 0 0 30px rgba(0, 242, 254, 0.5); transform: scale(1.05); }
        }

        .auth-input { 
            width: 100%; padding: 18px 25px; margin-bottom: 15px; 
            border-radius: 50px; border: 1px solid var(--border); 
            background: #1a1a21; color: white; outline: none; font-size: 14px;
        }
        .btn-row { display: flex; gap: 12px; margin-top: 10px; }
        .auth-btn { flex: 1; padding: 14px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; }
        .login-btn { background: var(--accent); color: #000; }
        .signup-btn { background: transparent; border: 1px solid var(--border); color: white; }
        .guest-link { margin-top: 25px; display: block; color: #555; font-size: 11px; cursor: pointer; font-weight: bold; letter-spacing: 1px; }

        /* --- REST OF UI --- */
        #system-ui { display: none; width: 100%; height: 100%; }
        .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
        .side-btn { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 50px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; font-size: 11px; }

        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        #lockdown-status { display: none; background: rgba(255, 62, 62, 0.15); color: var(--danger); text-align: center; padding: 10px; font-weight: bold; font-size: 12px; border-bottom: 1px solid var(--danger); }
        #chat-window { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 14px 20px; border-radius: 20px; max-width: 75%; font-size: 14px; }
        .user-msg { align-self: flex-end; background: var(--bubble-user); color: #000; }
        .bot-msg { align-self: flex-start; background: var(--bubble-bot); border: 1px solid var(--border); }

        .input-bar { padding: 25px; border-top: 1px solid var(--border); display: flex; gap: 10px; background: var(--sidebar); }
        #msg-input { flex: 1; background: var(--input-bg); border: 1px solid var(--border); padding: 15px 25px; border-radius: 50px; color: white; outline: none; }
        #msg-input:disabled { opacity: 0.3; }

        #cmd-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 20000; padding: 40px; }
        .modal-content { background: var(--sidebar); border: 1px solid var(--accent); padding: 30px; border-radius: 20px; max-width: 800px; margin: auto; height: 80vh; overflow-y: auto; }
        .cmd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 20px; }
        .cmd-box { padding: 10px; background: rgba(255,255,255,0.05); border-radius: 10px; font-size: 11px; cursor: pointer; border: 1px solid transparent; }
        .cmd-box:hover { border-color: var(--accent); }
    </style>
</head>
<body>

    <div id="auth-portal">
        <div class="auth-container">
            <div class="logo-box">
                <img src="https://www.adobe.com/express/create/ai/media_169572259d30c258a9193cdffe8b857d246f5dd68.png?width=750&format=png&optimize=medium" class="logo-img">
            </div>
            <input type="text" id="username-field" class="auth-input" placeholder="Username">
            <input type="password" id="password-field" class="auth-input" placeholder="Password">
            <div class="btn-row">
                <button class="auth-btn login-btn" onclick="performLogin()">LOGIN</button>
                <button class="auth-btn signup-btn" onclick="performSignup()">SIGNUP</button>
            </div>
            <span class="guest-link" onclick="startSession('Guest')">CONTINUE AS GUEST</span>
        </div>
    </div>

    <div id="cmd-modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between;">
                <h2 style="color:var(--accent)">100+ TRIGGERS</h2>
                <button onclick="toggleModal()" style="color:var(--danger); background:none; border:none; cursor:pointer; font-weight:bold;">CLOSE</button>
            </div>
            <div class="cmd-grid" id="cmd-list-inject"></div>
        </div>
    </div>

    <div id="system-ui">
        <div class="sidebar">
            <h2 style="color:var(--accent); margin-bottom: 20px;">Weixiang</h2>
            <button class="side-btn" onclick="toggleModal()">📚 SHOW COMMANDS</button>
            <button class="side-btn" onclick="location.reload()" style="margin-top:auto; border-color:var(--danger)">LOGOUT</button>
        </div>
        <div class="chat-area">
            <div id="lockdown-status">YAP LOCKDOWN: <span id="mute-timer">10</span>s</div>
            <div id="chat-window"></div>
            <div class="input-bar">
                <input type="text" id="msg-input" placeholder="Enter trigger word...">
                <button onclick="send()" style="background:var(--accent); border:none; padding:15px 30px; border-radius:50px; font-weight:bold; cursor:pointer;">SEND</button>
            </div>
        </div>
    </div>

    <script>
        let yapTracker = 0;
        // The 100+ commands from previous version remain stored here
        const roasts = {
            "you": "you can't even make urself better than me so quit yapping like a 4 years old begging for candies",
            "aura": "Aura: -50k. You bring the vibes down just by existing.",
            "rizz": "Your rizz is non-existent. It's actually painful to watch.",
            "job": "Get a job? Even the trash can wouldn't hire its competition.",
            "money": "Broke alert. You can't even pay attention.",
            "ugly": "If being ugly was a crime, you'd get the death penalty.",
            "gym": "The only thing you exercise is my patience.",
            "iq": "Your IQ is room temperature... in Celsius.",
            // ... (Includes all 100+ triggers from previous step)
        };

        function toggleModal() {
            const m = document.getElementById('cmd-modal');
            const list = document.getElementById('cmd-list-inject');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
            list.innerHTML = Object.keys(roasts).map(k => `<div class="cmd-box" onclick="useTrigger('${k}')"><b style="color:var(--accent)">${k.toUpperCase()}</b></div>`).join('');
        }

        function useTrigger(t) {
            document.getElementById('msg-input').value = t;
            toggleModal();
            send();
        }

        function performSignup() {
            const u = document.getElementById('username-field').value;
            const p = document.getElementById('password-field').value;
            if(u && p) { localStorage.setItem("os_user_" + u, p); alert("Account Secure."); }
        }

        function performLogin() {
            const u = document.getElementById('username-field').value;
            const p = document.getElementById('password-field').value;
            if(localStorage.getItem("os_user_" + u) === p && u !== "") startSession(u);
            else alert("Denied.");
        }

        function startSession(user) {
            document.getElementById('auth-portal').style.display = 'none';
            document.getElementById('system-ui').style.display = 'flex';
            botTalk("Roast OS Online. Scanning Target: " + user);
        }

        function botTalk(text) {
            const win = document.getElementById('chat-window');
            const d = document.createElement('div');
            d.className = "msg bot-msg"; d.innerText = text;
            win.appendChild(d); win.scrollTop = win.scrollHeight;
            window.speechSynthesis.cancel();
            const s = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(s);
        }

        function send() {
            const inp = document.getElementById('msg-input');
            const val = inp.value.trim().toLowerCase();
            if(!val || inp.disabled) return;

            const uD = document.createElement('div');
            uD.className = "msg user-msg"; uD.innerText = val;
            document.getElementById('chat-window').appendChild(uD);
            inp.value = "";

            setTimeout(() => {
                let response = "Pure Yap detected. Open the command menu.";
                if(val.includes("you") || val.includes(" u ")) {
                    yapTracker++;
                    response = roasts["you"];
                    if(yapTracker >= 3) { botTalk(response); lockdown(); return; }
                } else {
                    for(let key in roasts) { if(val.includes(key)) { response = roasts[key]; break; } }
                }
                botTalk(response);
            }, 600);
        }

        function lockdown() {
            const inp = document.getElementById('msg-input');
            const ban = document.getElementById('lockdown-status');
            const timer = document.getElementById('mute-timer');
            inp.disabled = true; ban.style.display = 'block';
            let t = 10;
            const i = setInterval(() => {
                t--; timer.innerText = t;
                if(t <= 0) { clearInterval(i); inp.disabled = false; ban.style.display = 'none'; yapTracker = 0; }
            }, 1000);
        }

        document.getElementById('msg-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    </script>
</body>
</html>
